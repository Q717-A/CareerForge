name: CI

on:
  push:
    branches: [main, "careerforge/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # 测试走 pytest-xdist 并行（-n auto），正常 ~5 分钟；30 分钟是给慢速
    # 共享 runner 与 coverage 收尾留的宽裕上限，而不是常规耗时。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install a CJK font for PDF export tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run Ruff
        run: python -m ruff check .

      - name: Test Windows launcher and release packaging
        if: runner.os == 'Windows'
        working-directory: .
        shell: powershell
        run: |
          .\scripts\tests\Test-Start-ResumeForge.ps1
          .\scripts\tests\Test-Build-Release.ps1

      - name: Run tests with coverage
        run: >-
          python -m pytest -n auto
          --cov=app
          --cov-config=../pyproject.toml
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage report