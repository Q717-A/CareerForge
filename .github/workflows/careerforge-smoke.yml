name: CareerForge Smoke

on:
  push:
    branches: ["careerforge/**"]
    paths:
      - "backend/app/**project_lab**"
      - "backend/app/application.py"
      - "backend/app/models/__init__.py"
      - "backend/app/services/feature_catalog.py"
      - "backend/tests/test_assistant_knowledge_audit.py"
      - "README.md"
      - "backend/app/services/feature_catalog.py"
      - "backend/tests/test_assistant_knowledge_audit.py"
      - "README.md"
      - "backend/migrations/versions/0022_project_lab.py"
      - "backend/tests/test_project_lab.py"
      - "backend/tests/test_migration_0022.py"
      - "backend/tests/test_database.py"
      - "backend/tests/test_backup_apply_tables.py"
      - "frontend/src/**"
      - ".github/workflows/careerforge-smoke.yml"
  pull_request:
    paths:
      - "backend/app/**project_lab**"
      - "backend/app/application.py"
      - "backend/app/models/__init__.py"
      - "backend/migrations/versions/0022_project_lab.py"
      - "backend/tests/test_project_lab.py"
      - "backend/tests/test_migration_0022.py"
      - "backend/tests/test_database.py"
      - "backend/tests/test_backup_apply_tables.py"
      - "frontend/src/**"
      - ".github/workflows/careerforge-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careerforge-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-project-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Ruff CareerForge changed surface
        run: >-
          python -m ruff check
          app/api/project_lab.py
          app/models/project_lab.py
          app/schemas/project_lab.py
          app/services/project_lab.py
          app/services/feature_catalog.py
          tests/test_project_lab.py
          tests/test_migration_0022.py
          tests/test_assistant_knowledge_audit.py
      - name: Project Lab focused tests
        run: >-
          python -m pytest -q
          tests/test_project_lab.py
          tests/test_migration_0022.py
          tests/test_assistant_knowledge_audit.py
          tests/test_database.py::test_alembic_upgrade_head_builds_schema_from_empty_database
          tests/test_backup_apply_tables.py::test_inspect_accepts_a_backup_exported_before_the_apply_tables

  frontend-project-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Focused UI tests
        run: npm test -- src/pages/ProjectLabPage.test.tsx src/App.test.tsx --maxWorkers=2
      - name: Typecheck
        run: npm run typecheck
      - name: Format check
        run: |
          npm run format
          git diff --exit-code -- src
      - name: Lint
        run: npm run lint
